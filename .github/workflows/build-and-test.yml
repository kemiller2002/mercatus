name: Build and test

# F# domain build and tests (WI-0013, CHK-DOM-01). Warnings are errors and an
# incomplete pattern match (FS0025) fails the build. A run that executes no
# tests, or skips any, fails too.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Mercatus.slnx -c Release
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          dotnet test Mercatus.slnx -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/test.txt"
          summary=$(grep -E "Passed!|Failed!" "$RUNNER_TEMP/test.txt" | tail -1)
          total=$(echo "$summary" | sed -nE 's/.*Total: *([0-9]+).*/\1/p')
          skipped=$(echo "$summary" | sed -nE 's/.*Skipped: *([0-9]+).*/\1/p')
          [ -n "$total" ] && [ "$total" -gt 0 ] || { echo "::error::no tests ran"; exit 1; }
          [ "${skipped:-0}" -eq 0 ] || { echo "::error::$skipped test(s) skipped"; exit 1; }
