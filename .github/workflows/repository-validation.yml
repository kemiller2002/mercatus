name: Repository validation

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for commit batch
        run: sleep 600

  validate:
    needs: debounce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent policy
        shell: bash
        run: test -s AGENTS.md
